<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>QR генератор</title>
<style>
/* Vector QR 0.1 — single 480px design coordinate system.
   The whole UI scales as one unit when the plugin window is smaller. */
:root {
  color-scheme: light;
  --ease: cubic-bezier(.2,.8,.2,1);
}

* {
  box-sizing: border-box;
}

html,body {
  padding: 0;
  margin: 0;
  width: 100%;
  background: #fff;
  color: #000;
  font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  overscroll-behavior: none;
}

button,input {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,input:focus-visible {
  outline: 2px solid #777;
  outline-offset: 2px;
}

button:disabled {
  cursor: not-allowed;
}

body {
  position: relative;
  display: block;
  overflow: hidden;
}

#app {
  width: 480px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 0;
  position: absolute;
  top: 0;
  left: 0;
  height: auto;
  max-width: none;
  overflow: visible;
  transform-origin: top left;
  transform: translate3d(var(--vqr-left,0px),0,0) scale(var(--vqr-scale,1));
  will-change: transform;
}

.header {
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}

.branding,.headActions {
  display: flex;
  align-items: center;
}

.branding {
  gap: 10px;
  font-size: 16px;
  font-weight: 500;
}

.brandicon {
  width: 20px;
  height: 20px;
  flex: none;
  background: #000;
  border-radius: 4px;
  position: relative;
}

.brandicon:before,.brandicon:after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  border: 1.5px solid #fff;
  border-radius: 1px;
  top: 4px;
  left: 4px;
  box-sizing: border-box;
}

.brandicon:after {
  left: 11px;
}

.brandicon i {
  position: absolute;
  width: 5px;
  height: 5px;
  border: 1.5px solid white;
  left: 4px;
  top: 11px;
  border-radius: 1px;
}

.headActions {
  gap: 0;
}

.lang {
  display: flex;
  gap: 9px;
  align-items: center;
}

.lang button {
  padding: 0;
  background: none;
  border: none;
  color: #c0c0c0;
  font-size: 12px;
}

.lang button.active {
  color: #000;
}

.tabs {
  height: 28px;
  display: flex;
  justify-content: flex-start;
  gap: 20px;
  flex: none;
}

.tabs button {
  border: 0;
  background: #fff;
  height: 28px;
  width: 57px;
  min-width: 0;
  border-radius: 6px;
  color: #000;
  transition: background .18s var(--ease),color .18s var(--ease);
  flex: 0 0 57px;
  font-size: 12px;
  line-height: 15px;
  white-space: nowrap;
  letter-spacing: 0;
  padding: 0 1px;
  overflow: visible;
}

.tabs button[data-type="text"],
.tabs button[data-type="phone"] {
  width: 56px;
  flex-basis: 56px;
}

.tabs button.active {
  background: #000;
  color: #fff;
}

.field {
  height: 36px;
  flex: none;
  border: 1px solid #000;
  background: #efefef;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px 0 18px;
}

.field input {
  min-width: 0;
  flex: 1;
  border: 0;
  background: transparent;
  outline: 0;
  line-height: 20px;
  font-size: 14px;
}

.field input::placeholder {
  color: #000;
  opacity: 1;
}

.clear {
  border: 0;
  background: none;
  width: 20px;
  height: 20px;
  position: relative;
  padding: 0;
}

.clear:before,.clear:after {
  content: "";
  position: absolute;
  width: 1px;
  height: 14px;
  background: #111;
  left: 10px;
  top: 3px;
  transform: rotate(45deg);
}

.clear:after {
  transform: rotate(-45deg);
}

.preview {
  height: 440px;
  flex: none;
  border: 1px solid #000;
  border-radius: 6px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff;
  overflow: hidden;
}

#qrCanvas {
  display: block;
  width: 320px;
  height: 320px;
  image-rendering: pixelated;
  transition: opacity .14s ease;
}

.colors {
  display: grid;
  grid-template-columns: 133px 57px 133px 57px;
  gap: 20px;
  height: 56px;
  flex: none;
}

.color-card {
  border: 1px solid #000;
  background: #efefef;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 6px 10px 6px 21px;
  overflow: hidden;
  gap: 4px;
}

.color-card label {
  font-size: 12px;
  color: #000000;
  white-space: nowrap;
}

.color-card input {
  border: 0;
  background: transparent;
  outline: 0;
  font-size: 14px;
  font-weight: 500;
  width: 103px;
  padding: 0;
  color: #000;
}

.color-swatch {
  border: 1px solid #000;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.color-swatch input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.toggle-row {
  height: 28px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-width: 0;
  gap: 12px;
}

.toggle-title {
  font-weight: 400;
  font-size: 20px;
  line-height: 24px;
}

.logo-box,.hole-box {
  width: 440px;
  flex: none;
  border: 1px solid #000;
  border-radius: 6px;
  transition: opacity .2s var(--ease);
  background: #fff;
}

.logo-box {
  height: 150px;
  padding: 10px;
}

.box-inner {
  height: 128px;
  display: flex;
  flex-direction: column;
  gap: 19px;
}

.file-button {
  height: 62px;
  width: 418px;
  background: #000;
  border: 0;
  border-radius: 4px;
  color: #fff;
  text-align: left;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.file-button span {
  overflow: hidden;
  text-overflow: ellipsis;
}

.slider-block {
  height: 47px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.metric {
  height: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #c5c5c5;
  font-size: 12px;
  line-height: 15px;
}

.metric output {
  color: #c5c5c5;
}

.range {
  width: 100%;
  margin: 0;
  display: block;
  height: 24px;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

.range::-webkit-slider-runnable-track {
  height: 2px;
  /* The filled (black) part meets the thumb centre; the rest stays light gray. */
  background: linear-gradient(to right,
    #111 0px, #111 var(--range-fill, 0px),
    #c9c9c9 var(--range-fill, 0px), #c9c9c9 100%);
}

.range::-webkit-slider-thumb {
  appearance: none;
  width: 24px;
  height: 24px;
  border: 0;
  border-radius: 5px;
  background: #111;
  position: relative;
  margin-top: -11px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.1);
  transition: transform .12s;
}

.range:active::-webkit-slider-thumb {
  transform: scale(1.06);
}

.range:disabled {
  cursor: default;
}

.range:disabled::-webkit-slider-thumb {
  background: #d5d5d5;
}

.hole-box {
  height: 136px;
  padding: 10px;
}

.hole-box .inner {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.hole-box .slider-block {
  height: 47px;
}

.inactive {
  opacity: .28;
  pointer-events: none;
}

.inactive .file-button {
  cursor: default;
}

.inactive .range {
  cursor: default;
}

.footer {
  height: 144px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  flex: none;
  z-index: 2;
  background: #fff;
}

.primary,.secondary {
  height: 62px;
  border-radius: 4px;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .18s,color .18s,transform .18s var(--ease);
}

.primary {
  background: #000;
  color: #fff;
  border: 1px solid #000;
}

.primary:hover,.file-button:hover {
  background: #282828;
}

.primary:active,.secondary:active {
  transform: scale(.992);
}

.secondary {
  background: #fff;
  color: #000;
  border: 1px solid #000;
}

.secondary:hover {
  background: #f3f3f3;
}

.export-row {
  display: grid;
  grid-template-columns: 210px 210px;
  gap: 20px;
}

#fileInput {
  display: none;
}

#notice {
  pointer-events: none;
  position: fixed;
  z-index: 10;
  bottom: 15px;
  left: 20px;
  right: 20px;
  padding: 12px 14px;
  background: #121212;
  color: #fff;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.4;
  transform: translateY(120%);
  opacity: 0;
  transition: transform .28s var(--ease),opacity .28s var(--ease);
}

#notice.show {
  opacity: 1;
  transform: translateY(0);
}

.scroll-content {
  height: auto;
  min-height: 0;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow: visible;
  overscroll-behavior: none;
}

.header,.tabs,.field {
  flex-shrink: 0;
}

.logo-box .box-inner {
  height: 128px;
  gap: 19px;
}

/* Figma source: 57 × 28 track, 24 × 24 thumb, exact 2px inset.
   Drawn in one SVG coordinate system so both states remain pixel-aligned
   when the entire interface is scaled to fit the Figma plugin window. */
.toggle-row .switch {
  appearance: none;
  display: block;
  position: relative;
  flex: 0 0 57px;
  width: 57px;
  height: 28px;
  min-width: 57px;
  margin: 0 0 0 auto;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  line-height: 0;
  outline-offset: 2px;
}

.toggle-row .switch svg {
  display: block;
  width: 57px;
  height: 28px;
  overflow: visible;
  pointer-events: none;
}

.switch-track {
  fill: #efefef;
  stroke: #000;
  stroke-width: 1;
  transition: fill .2s var(--ease);
}

.switch-thumb {
  fill: #fff;
  transition: transform .2s var(--ease);
}

.switch.on .switch-track {
  fill: #000;
}

.switch.on .switch-thumb {
  transform: translateX(29px);
}

#qrCanvas.transparent {
  background-color: #fff;
  background-image: linear-gradient(45deg,#ececec 25%,transparent 25%),linear-gradient(-45deg,#ececec 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#ececec 75%),linear-gradient(-45deg,transparent 75%,#ececec 75%);
  background-size: 16px 16px;
  background-position: 0 0,0 8px,8px -8px,-8px 0;
}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none;animation:none}}

 <section class="colors"><div class="color-card"><label id="fgLabel" for="fgHex">Цвет QR</label><input id="fgHex" maxlength="7" value="#000000" spellcheck="false"/></div><div class="color-swatch" id="fgSwatch" style="background:#000000"><input id="fgPick" type="color" value="#000000" aria-label="Цвет QR"/></div><div class="color-card"><label id="bgLabel" for="bgHex">Цвет фона</label><input id="bgHex" maxlength="7" value="#FFFFFF" spellcheck="false"/></div><div class="color-swatch" id="bgSwatch" style="background:#FFFFFF"><input id="bgPick" type="color" value="#FFFFFF" aria-label="Цвет фона"/></div></section>
 <section class="toggle-row"><span class="toggle-title" id="logoTitle">Добавить логотип</span><button id="logoToggle" class="switch on" role="switch" aria-checked="true" aria-label="Добавить логотип"><svg viewBox="0 0 57 28" aria-hidden="true" focusable="false"><rect class="switch-track" x="0.5" y="0.5" width="56" height="27" rx="5.5"/><rect class="switch-thumb" x="2" y="2" width="24" height="24" rx="4"/></svg></button></section>
 <section class="logo-box" id="logoBox"><div class="box-inner"><button id="chooseLogo" class="file-button"><span id="logoFilename">Выбрать логотип.svg</span></button><div class="slider-block"><div class="metric"><span id="logoScaleLabel">Размер логотипа</span><output id="logoOutput">30%</output></div><input id="logoScale" class="range" type="range" min="5" max="45" value="30" step="1" aria-label="Размер логотипа"/></div></div></section>
 <section class="toggle-row"><span class="toggle-title" id="holeTitle">Область под логотип</span><button id="holeToggle" class="switch" role="switch" aria-checked="false" aria-label="Область под логотип"><svg viewBox="0 0 57 28" aria-hidden="true" focusable="false"><rect class="switch-track" x="0.5" y="0.5" width="56" height="27" rx="5.5"/><rect class="switch-thumb" x="2" y="2" width="24" height="24" rx="4"/></svg></button></section>
 <section class="hole-box inactive" id="holeBox"><div class="inner"><div class="slider-block"><div class="metric"><span id="holeWLabel">Ширина области под логотип</span><output id="holeWOutput">0</output></div><input id="holeW" class="range" type="range" min="0" max="50" step="1" value="0" disabled aria-label="Ширина области под логотип"/></div><div class="slider-block"><div class="metric"><span id="holeHLabel">Высота области под логотип</span><output id="holeHOutput">0</output></div><input id="holeH" class="range" type="range" min="0" max="40" step="1" value="0" disabled aria-label="Высота области под логотип"/></div></div></section>
 </div>
 <footer class="footer"><button class="primary" id="insert">Добавить QR-код на макет</button><div class="export-row"><button class="secondary" id="exportPng">Экспорт PNG</button><button class="secondary" id="exportSvg">Экспорт SVG</button></div></footer>
</main><input id="fileInput" type="file" accept="image/svg+xml,.svg"/><div id="notice" role="status" aria-live="polite"></div>

	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);

		offset++;

	for (var i = 0; i < num.length - offset; i++) {

  var w=vals[2],h=vals[3];if(!(w>0&&h>0))return obj;
  var scale=420/Math.max(w,h),cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
  var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  var cc=cv.getContext('2d',{willReadFrequently:true});if(!cc)return obj;
  cc.clearRect(0,0,cw,ch);cc.drawImage(originalImage,0,0,cw,ch);
  var data=cc.getImageData(0,0,cw,ch).data;
  var minX=cw,minY=ch,maxX=-1,maxY=-1;
  for(var y=0;y<ch;y++)for(var x=0;x<cw;x++){
   if(data[(y*cw+x)*4+3]>20){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  }
  if(maxX<minX || maxY<minY)return obj;
  // A one-pixel visual margin avoids cutting antialiased edges.
  minX=Math.max(0,minX-1);minY=Math.max(0,minY-1);
  maxX=Math.min(cw,maxX+2);maxY=Math.min(ch,maxY+2);
  if(minX===0&&minY===0&&maxX===cw&&maxY===ch)return obj;
  var nx=vals[0]+minX/cw*w,ny=vals[1]+minY/ch*h;
  var nw=(maxX-minX)/cw*w,nh=(maxY-minY)/ch*h;
  if(!(nw>0&&nh>0))return obj;
  return {inner:obj.inner,width:nw,height:nh,viewBox:[nx,ny,nw,nh].map(function(z){return Number(z.toFixed(6));}).join(' ')};
 }catch(e){return obj;}
}
/* Monochrome SVG logo follows the QR foreground. Keep true holes, opacity,
   strokes and light counter-shapes intact. SVG remains vector in Figma/SVG. */
function paintValue(n,prop){
 for(var at=n;at&&at.nodeType===1;at=at.parentElement){
  var v=at.style&&at.style.getPropertyValue(prop);
  if(v)return v.trim();
  v=at.getAttribute(prop);
  if(v)return v.trim();
 }
 return prop==='fill'?'black':'none';
}
function isWhitePaint(v){
 v=String(v||'').replace(/\s+/g,'').toLowerCase();
 return v==='#fff'||v==='#ffffff'||v==='white'||v==='rgb(255,255,255)'||v==='rgb(100%,100%,100%)';
}
function tintLogo(logo,fg){
 if(!logo)return null;
 var doc=new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">'+logo.inner+'</svg>','image/svg+xml');
 var root=doc.documentElement;
 var items=Array.prototype.slice.call(root.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line,text,tspan,use'));
 // Referenced vectors inside <defs>/<symbol> must also be recolored.
 // Ignore clipping/masking shapes because they control transparency, not visible paint.
 var painted=items.filter(function(n){return !n.closest('clipPath,mask,pattern,marker');});
 var hasDark=painted.some(function(n){
  var v=paintValue(n,'fill');
  return v!=='none'&&v!=='transparent'&&!isWhitePaint(v);
 });
 var target=VQR.hex(fg);
 painted.forEach(function(n){
  var fill=paintValue(n,'fill'),stroke=paintValue(n,'stroke');
  var isLine=n.localName.toLowerCase()==='line';
  if(!isLine&&fill!=='none'&&fill!=='transparent'&&!(hasDark&&isWhitePaint(fill))){
   n.setAttribute('fill',target);
   n.style.setProperty('fill',target,'important');
  }
  if(stroke!=='none'&&stroke!=='transparent'&&!(hasDark&&isWhitePaint(stroke))){
   n.setAttribute('stroke',target);
   n.style.setProperty('stroke',target,'important');
  }
 });
 var inner=new XMLSerializer().serializeToString(root).replace(/^<svg[^>]*>/i,'').replace(/<\/svg>\s*$/i,'');
 return {inner:inner,width:logo.width,height:logo.height,viewBox:logo.viewBox};
}
function getTintedLogo(){
 if(!state.logo)return null;
 if(!state.tintedLogo||state.tintedLogo.source!==state.logo||state.tintedLogo.color!==state.fg){
  state.tintedLogo={source:state.logo,color:state.fg,result:tintLogo(state.logo,state.fg)};
 }
 return state.tintedLogo.result;
}
function refreshTintedLogo(){
 var token=++state.tintToken;
 state.logoImage=null;
 if(!state.logo){state.tintReady=Promise.resolve();requestDraw();return state.tintReady;}
 var colorized;
 try{colorized=getTintedLogo();}catch(e){state.tintReady=Promise.resolve();note('Ошибка цвета SVG: '+(e.message||String(e)));requestDraw();return state.tintReady;}
 state.tintReady=new Promise(function(resolve){
  openLogoImage(colorized,function(img){if(token===state.tintToken){state.logoImage=img;requestDraw();}resolve();},
    function(){if(token===state.tintToken){note('Не удалось перекрасить SVG-логотип.');requestDraw();}resolve();});
 });
 return state.tintReady;
}
function openLogoImage(obj,onDone,onError){
 try{
  var data='<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="'+obj.viewBox.replace(/[^-0-9.eE ,+]/g,'')+'">'+obj.inner+'</svg>';
  var blob=new Blob([data],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();
  img.onload=function(){URL.revokeObjectURL(url);onDone(img);};
  img.onerror=function(){URL.revokeObjectURL(url);onError();};
  img.src=url;
 }catch(e){onError();}
}
function useImportedLogo(raw,name,token){
 if(token!==state.logoImportToken)return;
 var initial=cleanSVG(raw);
 openLogoImage(initial,function(img){
  if(token!==state.logoImportToken)return;
  var cropped=autoTrimLogo(initial,img);
  if(cropped===initial){finish(initial);return;}
  openLogoImage(cropped,function(){finish(cropped);},function(){finish(initial);});
  function finish(obj){
   if(token!==state.logoImportToken)return;
   state.logo=obj;
   state.tintedLogo=null;
   el('logoFilename').textContent=name;
   refreshTintedLogo();slowCompute();
  }
 },function(){if(token===state.logoImportToken)note('Не удалось открыть SVG.');});
}

function ensureFresh(){var text=currentText();if(!text)throw new Error(state.lang==='ru'?'Введите данные для QR.':'Enter QR content.');var hole=normalizedHole();var next=VQR.fit(text,hole.w,hole.h,state.base);state.base=next.base;state.model=next.m;requestDraw();return next.m;}
function fullSvg(forceTransparent){var model=ensureFresh();return VQR.svg(model,1000,state.fg,state.bg,state.mode==='logo'?getTintedLogo():null,!!forceTransparent||state.noBackground);}
function download(blob,name){var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},2000);}
function exportSVG(){try{download(new Blob([fullSvg()],{type:'image/svg+xml;charset=utf-8'}),'vector-qr.svg');}catch(e){note(e.message);}}
function exportPNG(){
 // A color change can start a new image load while the previous one is pending.
 // Export only after the CURRENT logo image has finished rasterizing.
 function waitForCurrentTint(){
  var pending=state.tintReady;
  return Promise.resolve(pending).then(function(){
   return state.tintReady===pending?null:waitForCurrentTint();
  });
 }
 waitForCurrentTint().then(function(){
  try{
   if(state.mode==='logo'&&state.logo&&!state.logoImage)
    throw new Error('Логотип не удалось подготовить для PNG. Экспорт отменён.');
   var model=ensureFresh(),canvas=document.createElement('canvas');
   canvas.width=canvas.height=1000;
   var transparent=!!state.noBackground;
   renderCanvas(canvas,canvas.getContext('2d',{alpha:transparent}),model,!transparent);
   canvas.toBlob(function(blob){
    if(blob)download(blob,'vector-qr.png');
    else note(state.lang==='ru'?'Не удалось экспортировать PNG.':'Failed to export PNG.');
   },'image/png');
  }catch(e){note(e.message||String(e));}
 });
}
window.addEventListener('message',function(e){var m=e.data&&e.data.pluginMessage;if(m&&m.type==='inserted')note(state.lang==='ru'?'QR добавлен на макет.':'QR added to canvas.');if(m&&m.type==='error')note(m.message);});
// Inputs and view update instantly. Encoding only runs after text settles; never per keystroke.
el('content').addEventListener('input',function(e){state.value=e.target.value;slowCompute();});
el('clear').addEventListener('click',function(){el('content').value='';state.value='';slowCompute();el('content').focus();});
Array.prototype.forEach.call(document.querySelectorAll('[data-type]'),function(b){b.addEventListener('click',function(){document.querySelector('.tabs .active').classList.remove('active');b.classList.add('active');state.type=b.dataset.type;state.value='';el('content').value='';translate(state.lang);slowCompute();el('content').focus();});});
el('ru').addEventListener('click',function(){translate('ru');});el('en').addEventListener('click',function(){translate('en');});

el('noBackgroundToggle').addEventListener('click',function(){state.noBackground=!state.noBackground;el('noBackgroundToggle').classList.toggle('on',state.noBackground);el('noBackgroundToggle').setAttribute('aria-checked',String(state.noBackground));requestDraw();});
el('logoToggle').addEventListener('click',toggleLogo);el('holeToggle').addEventListener('click',toggleHole);
// Keep the original Figma slider appearance: black progress up to the thumb,
// light-gray unfilled track. Use the actual rendered track width for pixel alignment.
function syncRangeFill(input){
 var min=Number(input.min)||0,max=Number(input.max)||100;
 var progress=Math.max(0,Math.min(1,(Number(input.value)-min)/Math.max(1,max-min)));
 var width=input.clientWidth;
 var fill=12+progress*Math.max(0,width-24); // 24px thumb, 12px to its centre
 input.style.setProperty('--range-fill',fill.toFixed(2)+'px');
}
function syncRangeFills(){['logoScale','holeW','holeH'].forEach(function(id){syncRangeFill(el(id));});}
el('logoScale').addEventListener('input',function(e){state.logoPercent=+e.target.value;el('logoOutput').textContent=state.logoPercent+'%';syncRangeFill(e.target);updateFast();});
['holeW','holeH'].forEach(function(id){el(id).addEventListener('input',function(e){var field=id==='holeW'?'holeW':'holeH';state[field]=+e.target.value;el(id+'Output').textContent=state[field]+'%';clampHole(id==='holeW'?'w':'h');syncRangeFills();updateFast();});});
el('chooseLogo').addEventListener('click',function(){el('fileInput').click();});
el('fileInput').addEventListener('change',function(e){
 var f=e.target.files&&e.target.files[0];if(!f)return;
 var token=++state.logoImportToken;
 if(f.size>500000)note('Размер SVG не должен превышать 500 КБ.');
 else f.text().then(function(raw){
  if(token!==state.logoImportToken)return;
  try{useImportedLogo(raw,f.name,token);}catch(err){if(token===state.logoImportToken)note(err.message||'Ошибка SVG');}
 },function(){if(token===state.logoImportToken)note('Не удалось прочитать файл SVG.');});
 e.target.value='';
});
['fg','bg'].forEach(function(k){el(k+'Pick').addEventListener('input',function(e){setColor(k,e.target.value);});el(k+'Hex').addEventListener('input',function(e){if(validColor(e.target.value))setColor(k,e.target.value,true);});el(k+'Hex').addEventListener('blur',function(e){e.target.value=state[k];});});
el('insert').addEventListener('click',function(){try{parent.postMessage({pluginMessage:{type:'insert',svg:fullSvg(true),foreground:state.fg,background:state.noBackground?null:state.bg,mode:state.mode,size:1000}},'*');}catch(e){note(e.message);}});
el('exportSvg').addEventListener('click',exportSVG);el('exportPng').addEventListener('click',exportPNG);

// Auto-size without listening to individual inputs: no expensive work while typing.
var _lastWindowRequest='';
function requestAdaptiveWindow(){
 var sw=0,sh=0;
 try{sw=window.screen&&window.screen.availWidth||0;sh=window.screen&&window.screen.availHeight||0;}catch(e){}
 if(!(sw>0))sw=window.innerWidth;
 if(!(sh>0))sh=window.innerHeight+100;
 var width=Math.max(300,Math.min(480,Math.floor(sw-36)));
 var height=Math.max(400,Math.min(1334,Math.floor(sh-100)));
 var key=width+'x'+height;
 if(key===_lastWindowRequest)return;
 _lastWindowRequest=key;
 try{parent.postMessage({pluginMessage:{type:'adapt-size',width:width,height:height}},'*');}catch(e){}
}
// Fit all of the original controls within the real iframe viewport. Never scroll.
var _fitQueued=false;
function fitWithoutScroll(){
 var app=el('app');if(!app)return;
 // Measurements are in the original Figma coordinate system, even when the
 // window is smaller. A single transform avoids independently rounded zoom
 // and @media styles moving switches, sliders and footer out of alignment.
 var naturalHeight=app.scrollHeight;
 var naturalWidth=480;
 var availableHeight=Math.max(1,window.innerHeight-2);
 var availableWidth=Math.max(1,window.innerWidth-2);
 var factor=Math.min(1,availableHeight/Math.max(1,naturalHeight),availableWidth/naturalWidth);
 factor=Math.max(.1,Math.floor(factor*10000)/10000);
 var left=Math.max(0,(availableWidth-naturalWidth*factor)/2);
 app.style.setProperty('--vqr-scale',String(factor));
 app.style.setProperty('--vqr-left',left.toFixed(3)+'px');
}
function queueFit(){if(_fitQueued)return;_fitQueued=true;requestAnimationFrame(function(){_fitQueued=false;fitWithoutScroll();});}
window.addEventListener('resize',function(){queueFit();requestAdaptiveWindow();},{passive:true});
window.addEventListener('orientationchange',function(){queueFit();requestAdaptiveWindow();},{passive:true});
requestAnimationFrame(function(){requestAdaptiveWindow();queueFit();});
translate('ru');setMode('logo');syncRangeFills();slowCompute();
})();
</script>
</body></html>
