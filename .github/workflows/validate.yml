name: Validate plugin
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  static-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and manifest
        run: node scripts/validate.mjs
