name: One-time author email privacy migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-email-rewrite.yml"

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.head_commit.message == 'maintenance: one-time author email privacy migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and rewrite commit email metadata
        shell: bash
        env:
          NOREPLY: 342084206+kbnndk@users.noreply.github.com
        run: |
          set -euo pipefail
          git checkout -B main "$GITHUB_SHA"
          ORIGINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter '
            GIT_AUTHOR_EMAIL="342084206+kbnndk@users.noreply.github.com"
            GIT_COMMITTER_EMAIL="342084206+kbnndk@users.noreply.github.com"
            export GIT_AUTHOR_EMAIL GIT_COMMITTER_EMAIL
          ' -- main
          NEW_TREE="$(git rev-parse 'main^{tree}')"
          test "$ORIGINAL_TREE" = "$NEW_TREE"
          if git log main --format='%ae%n%ce' | grep -vFx "$NOREPLY"; then
            echo 'Unexpected author or committer email detected; aborting'
            exit 1
          fi
          echo 'Commit emails rewritten; file tree unchanged'
          git push --force-with-lease="refs/heads/main:$GITHUB_SHA" origin main:refs/heads/main
          echo 'Updated main with sanitized author metadata'
